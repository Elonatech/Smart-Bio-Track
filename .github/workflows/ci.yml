name: CI

on:
  pull_request:
    branches: [main, develop, testing]
  push:
    branches: [main, develop, testing]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo run lint

      # Typecheck catches a whole class of errors that lint and tests do not —
      # a broken build reached the shared branch once because this step did not
      # exist. Do not remove it.
      - name: Typecheck
        run: pnpm turbo run check-types

      - name: Test
        run: pnpm turbo run test